<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Museo virtual - Globo sonda</title>

  <!-- Librería A-Frame -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
</head>

<body>
<a-scene>

  <!-- RECURSOS -->
  <a-assets>
    <!-- Modelos 3D -->
    <a-asset-item id="museo" src="museo2.glb"></a-asset-item>
    <a-asset-item id="globo" src="globo.glb"></a-asset-item>
    <a-asset-item id="caballete" src="caballete.glb"></a-asset-item>
    <a-asset-item id="laboratorio" src="laboratorio.glb"></a-asset-item>
    <a-asset-item id="cristal1" src="cristal1.glb"></a-asset-item>
    <a-asset-item id="cristal2" src="cristal2.glb"></a-asset-item>
    <a-asset-item id="cristal3" src="cristal3.glb"></a-asset-item>
    <a-asset-item id="cristal5" src="cristal5.glb"></a-asset-item>
    <a-asset-item id="variosvasos" src="variosvasos.glb"></a-asset-item>
   

    <!-- Imágenes -->
    <img id="logos" src="logos.png">
    <img id="minerales" src="minerales.jpg">
    <img id="datos_semillas" src="datos_semillas.jpg">
    <img id="poster_global" src="poster_global.png">
    <img id="biologia" src="biologia.png">
    <img id="cartelfisica" src="cartelfisica.png">
    <img id="cartelbiologia" src="cartelbiologia.png">
    <img id="lanzamiento" src="lanzamiento.png">
    <img id="fotocristal1" src="fotocristal1.png">
    <img id="fotocristal2" src="fotocristal2.png">
    <img id="plantas" src="plantas.png">

    <!-- Vídeo -->
    <video 
      id="concurso" 
      src="concurso.mp4"
      autoplay
      loop
      muted
      playsinline
      webkit-playsinline
      preload="auto"
      crossorigin="anonymous">
    </video>
  </a-assets>
   <video 
      id="hinchar_globo" 
      src="hinchar_globo.mp4"
      autoplay
      loop
      muted
      playsinline
      webkit-playsinline
      preload="auto"
      crossorigin="anonymous">
    </video>
  </a-assets>

  <!-- CIELO AZUL -->
  <a-sky color="#87CEEB"></a-sky>

  <!-- LUZ GENERAL -->
  <a-light 
    type="ambient" 
    color="#FFFFFF" 
    intensity="0.7">
  </a-light>

  <a-light 
    type="directional" 
    position="4 8 4" 
    intensity="0.8">
  </a-light>

 

  <!-- MODELO DEL MUSEO -->
  <a-entity 
    gltf-model="#museo"  
    position="0 0 0"  
    rotation="0 0 0"  
    scale="2 2 2">
  </a-entity>
  <a-entity 
    gltf-model="#laboratorio"  
    position="14 0 0"  
    rotation="0 180 0"  
    scale="0.5 0.5 0.5">
  </a-entity>
  <a-entity 
    gltf-model="#cristal1"  
    position="13.5 2.15 -5"  
    rotation="0 180 0"  
    scale="0.4 0.25 0.4">
  </a-entity>
   <a-image 
    src="#fotocristal1" 
    position="14 3 -5"
    rotation="0 -90 0" 
    width="1" 
    height="1"> 
  </a-image>
  <a-entity 
    gltf-model="#cristal2"  
    position="13.25 2.15 -1"  
    rotation="0 180 0"  
    scale="0.4 0.25 0.4">
  </a-entity>
  <a-image 
    src="#fotocristal2" 
    position="14 3 -1"
    rotation="0 -90 0" 
    width="1" 
    height="1"> 
  </a-image>

  <a-entity 
    gltf-model="#cristal3"  
    position="13.5 2.95 -3"  
    rotation="0 180 0"  
    scale="0.25 0.25 0.25">
  </a-entity>
   <a-entity 
    gltf-model="#cristal5"  
    position="13.5 2.15 -2"  
    rotation="0 180 0"  
    scale="0.25 0.25 0.25">
  </a-entity>
  <a-entity 
    gltf-model="#laboratorio"  
    position="-14 0 0"  
    rotation="0 0 0"  
    scale="0.5 0.5 0.5">
  </a-entity>
  <a-image 
    src="#datos_semillas" 
    position="-14 2.25 0"
    rotation="-90 0 90" 
    width="1" 
    height="2"> 
  </a-image>
  <a-image 
    src="#datos_semillas" 
    position="-14 2.26 0"
    rotation="-90 15 90" 
    width="1" 
    height="2"> 
  </a-image>
  <a-image 
    src="#datos_semillas" 
    position="-14 2.27 0"
    rotation="-90 20 90" 
    width="1" 
    height="2"> 
  </a-image>
  <a-image 
    src="#datos_semillas" 
    position="-14 2.25 0"
    rotation="-90 30 90" 
    width="1" 
    height="2"> 
  </a-image>
  
  <a-entity 
    gltf-model="#variosvasos"  
    position="-14 2.25 -5"  
    rotation="0 0 0"  
    scale="0.15 0.15 0.15">
  </a-entity>
 

  <!-- GLOBO SONDA FUERA DEL MUSEO -->
  <a-entity 
    gltf-model="#globo" 
    position="0 1 30" 
    rotation="0 90 0" 
    scale="1 1 1">
  </a-entity>

  <!-- CABALLETE FUERA DEL MUSEO -->
  <a-entity 
    gltf-model="#caballete" 
    position="10 0 30" 
    rotation="0 90 0" 
    scale="1 1.5 1">
  </a-entity>
  <a-image 
    src="#logos" 
    position="10.25 6 31.25"
    rotation="0 90 0" 
    width="1.25" 
    height="0.45"> 
  </a-image>
   <a-image 
    src="#lanzamiento" 
    position="10 3.5 30"
    rotation="0 -90 0" 
    width="4" 
    height="6"> 
  </a-image>
   <a-video
    src="#hinchar_globo"
    position="10 3 35"
    rotation="0 90 0"
    width="3"
    height="5">
  </a-video>

  <a-entity 
    gltf-model="#caballete" 
    position="10 0 35" 
    rotation="0 90 0" 
    scale="1 1.5 1">
  </a-entity>
  <a-image 
    src="#logos" 
    position="10.25 6 36.25"
    rotation="0 90 0" 
    width="1.25" 
    height="0.45"> 
  </a-image>
   <a-entity 
    gltf-model="#caballete" 
    position="-5 0 35" 
    rotation="0 90 0" 
    scale="1 1.5 1">
  </a-entity>
  <a-image 
    src="#logos" 
    position="-5 6 33.75"
    rotation="0 90 0" 
    width="1" 
    height="0.45"> 
  </a-image>
   <a-entity 
    gltf-model="#caballete" 
    position="-5 0 30" 
    rotation="0 90 0" 
    scale="1 1.5 1">
  </a-entity>
  <a-image 
    src="#logos" 
    position="-5 6 29"
    rotation="0 90 0" 
    width="1.25" 
    height="0.45"> 
  </a-image>

  <!-- LOGOS EN LA PARED -->
  <a-image 
    src="#logos" 
    position="-9 5.25 8.15"
    rotation="0 0 0" 
    width="4" 
    height="1"> 
  </a-image>

  <!-- PÓSTER DE MINERALES / CRISTALES -->
  <a-image 
    src="#cartelfisica" 
    position="16 4 0"
    rotation="0 -90 0" 
    width="4" 
    height="4"> 
  </a-image>
  <a-image 
    src="#cartelbiologia" 
    position="-15.95 4 0"
    rotation="0 90 0" 
    width="4" 
    height="4"> 
  </a-image>
  <a-image 
    src="#plantas" 
    position="-15.95 3 3"
    rotation="0 90 0" 
    width="3" 
    height="5"> 
  </a-image>
  <a-image 
    src="#minerales" 
    position="10 3.5 -8"
    rotation="0 0 0" 
    width="4" 
    height="6"> 
  </a-image>

  <!-- VÍDEO DEL CONCURSO -->
  <a-video
    src="#concurso"
    position="10 3 7.5"
    rotation="0 180 0"
    width="7"
    height="5">
  </a-video>

  <!-- PÓSTER DE BIOLOGÍA -->
  <a-image 
    src="#biologia" 
    position="0 3.5 -8"
    rotation="0 0 0" 
    width="4" 
    height="6"> 
  </a-image>

  <!-- PÓSTER GLOBAL -->
  <a-image 
    src="#poster_global" 
    position="8 3.5 8.15"
    rotation="0 0 0" 
    width="4" 
    height="6"> 
  </a-image>

  <!-- CÁMARA DEL VISITANTE -->
  <a-entity
    position="0 3 35"
    camera
    look-controls
    wasd-controls>
  </a-entity>

</a-scene>
</body>
</html>
