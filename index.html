<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Museo virtual - Globo sonda</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
</head>

<body>
<a-scene>

  <a-assets>
    <a-asset-item id="museo" src="museo.glb"></a-asset-item>
    <a-asset-item id="globo" src="globo.glb"></a-asset-item>
  </a-assets>

  <!-- CIELO AZUL -->
  <a-sky color="#87CEEB"></a-sky>

  <!-- LUZ GENERAL -->
  <a-light type="ambient" color="#FFFFFF" intensity="0.7"></a-light>
  <a-light type="directional" position="4 8 4" intensity="0.8"></a-light>

  <!-- PLANO VERDE EXTERIOR: CÉSPED -->
  <a-plane
    position="0 0 0"
    rotation="-90 0 0"
    width="100"
    height="100"
    color="#5FAF45">
  </a-plane>

 



  <!-- MODELO DEL MUSEO -->
  <a-entity 
    gltf-model="#museo"  
    position="0 0 0"  
    rotation="0 0 0"  
    scale="1 1 1">
  </a-entity>

  <!-- GLOBO SONDA FUERA DEL MUSEO -->
  <a-entity 
    gltf-model="#globo" 
    position="0 2 -16" 
    rotation="0 0 0" 
    scale="1 1 1">
  </a-entity>


  </a-text>

  <!-- CÁMARA -->
  <a-entity
    position="0 1.6 10"
    camera
    look-controls
    wasd-controls>
  </a-entity>

</a-scene>
</body>
</html>
