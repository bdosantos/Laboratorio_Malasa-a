<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>Laboratorio Malasaña: Ciencia en Condiciones Extremas</title>

  <!-- Librería A-Frame -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
</head>

<body>

<a-scene>

  <!-- ========================================================= -->
  <!-- 1. RECURSOS: MODELOS, IMÁGENES Y VÍDEOS                  -->
  <!-- ========================================================= -->

  <a-assets timeout="5000">

    <!-- ===================== -->
    <!-- Modelos 3D principales -->
    <!-- ===================== -->

    <a-asset-item id="museo" src="museo2.glb"></a-asset-item>
    <a-asset-item id="globo" src="globo.glb"></a-asset-item>
    <a-asset-item id="caballete" src="caballete.glb"></a-asset-item>
    <a-asset-item id="laboratorio" src="laboratorio.glb"></a-asset-item>

    <!-- ===================== -->
    <!-- Modelos 3D de Física y Química -->
    <!-- ===================== -->

    <a-asset-item id="ordenador" src="ordenador.glb"></a-asset-item>
    <a-asset-item id="microscopio" src="microcopio.glb"></a-asset-item>
    <a-asset-item id="cuarzo" src="cuarzo.glb"></a-asset-item>
    
    
      <!-- ===================== -->
    <!-- Modelos 3D de biología-->
    <!-- ===================== -->

    <a-asset-item id="vasolentejas" src="vasolentejas.glb"></a-asset-item>
    <a-asset-item id="planta1" src="planta1.glb"></a-asset-item>
    <a-asset-item id="planta11" src="planta11.glb"></a-asset-item>
    <a-asset-item id="planta2" src="planta2.glb"></a-asset-item>
    <a-asset-item id="planta3" src="planta3.glb"></a-asset-item>
    <a-asset-item id="sinvaso" src="sinvaso.glb"></a-asset-item>
    <a-asset-item id="regla" src="regla.glb"></a-asset-item>
    <a-asset-item id="variosvasos" src="variosvasos.glb"></a-asset-item>

    <!-- ===================== -->
    <!-- Imágenes generales -->
    <!-- ===================== -->

    <img id="logos" src="logos.png">
    <img id="poster_global" src="poster_global.png">

    <!-- ===================== -->
    <!-- Imágenes de Física y Química -->
    <!-- ===================== -->

    <img id="minerales" src="minerales.jpg">
    <img id="cartelfisica" src="cartelfisica.png">
    <img id="fotocristal1" src="fotocristal1.png">
    <img id="fotocristal2" src="fotocristal2.png">
    <img id="cristalizacion" src="cristalizacion.png">
    <img id="doscristalizacion" src="doscristalizacion.png">
    <img id="temperatura" src="temperatura.png">

    <!-- ===================== -->
    <!-- Imágenes de Biología -->
    <!-- ===================== -->

    <img id="datos_semillas" src="datos_semillas.jpg">
    <img id="biologia" src="biologia.png">
    <img id="cartelbiologia" src="cartelbiologia.png">
    <img id="plantas" src="plantas.png">
    <img id="lentejas" src="lentejas.png">

    <!-- ===================== -->
    <!-- Imágenes del globo sonda -->
    <!-- ===================== -->

    <img id="lanzamiento" src="lanzamiento.png">

    <!-- ===================== -->
    <!-- Vídeos -->
    <!-- ===================== -->

    <video 
      id="concurso" 
      src="concurso.mp4"
      autoplay
      loop
      muted
      playsinline
      webkit-playsinline
      preload="auto"
      crossorigin="anonymous">
    </video>

    <video 
      id="hinchar_globo" 
      src="hinchar_globo.mp4"
      autoplay
      loop
      muted
      playsinline
      webkit-playsinline
      preload="auto"
      crossorigin="anonymous">
    </video>

  </a-assets>


  <!-- ========================================================= -->
  <!-- 2. ENTORNO GENERAL: CIELO, LUZ Y MUSEO                   -->
  <!-- ========================================================= -->

  <!-- Cielo azul -->
  <a-sky color="#87CEEB"></a-sky>

  <!-- Luz ambiental -->
  <a-light 
    type="ambient" 
    color="#FFFFFF" 
    intensity="0.7">
  </a-light>

  <!-- Luz direccional -->
  <a-light 
    type="directional" 
    position="4 8 4" 
    intensity="0.8">
  </a-light>

  <!-- Modelo del museo -->
  <a-entity 
    gltf-model="#museo"  
    position="0 0 0"  
    rotation="0 0 0"  
    scale="2 2 2">
  </a-entity>


  <!-- ========================================================= -->
  <!-- 3. ZONA DE FÍSICA Y QUÍMICA: CRISTALIZACIÓN              -->
  <!-- ========================================================= -->

  <!-- Laboratorio de Física y Química -->
  <a-entity 
    gltf-model="#laboratorio"  
    position="14 0 0"  
    rotation="0 180 0"  
    scale="0.5 0.5 0.5">
  </a-entity>

  <!-- Cartel de Física y Química -->
  <a-image 
    src="#cartelfisica" 
    position="16 4.5 0"
    rotation="0 -90 0" 
    width="3" 
    height="3"> 
  </a-image>

  <!-- Póster de minerales / cristales -->
   <a-image 
    src="#cristalizacion" 
    position="16 4.5 -5"
    rotation="0 -90 0" 
    width="3.5" 
    height="5"> 
  </a-image>
   <a-image 
    src="#doscristalizacion" 
    position="16 4.5 5"
    rotation="0 -90 0" 
    width="3.5" 
    height="5"> 
  </a-image>
   <a-image 
    src="#temperatura" 
    position="14 4 -8"
    rotation="0 0 0" 
    width="3.5" 
    height="5"> 
  </a-image>
  <a-image 
    src="#minerales" 
    position="10 3.5 -8"
    rotation="0 0 0" 
    width="4" 
    height="6"> 
  </a-image>

  <!-- ordenador -->
  <a-entity 
    gltf-model="#ordenador"  
    position="13.75 2.25 -5"  
    rotation="0 -90 0"  
    scale="1 1 1">
  </a-entity>

  <!-- microscopio -->
  <a-entity 
    gltf-model="#microscopio"  
    position="13.5 2.15 -2"  
    rotation="0 -90 0"  
    scale="0.15 0.15 0.15">
  </a-entity>
  <!-- microscopio -->
  <a-entity 
    gltf-model="#cuarzo"  
    position="13.5 5 -2"  
    rotation="0 -90 0"  
    scale="0.15 0.15 0.15">
  </a-entity>


  <!-- ========================================================= -->
  <!-- 4. ZONA DE BIOLOGÍA: PLANTAS, LENTEJAS Y SEMILLAS        -->
  <!-- ========================================================= -->

  <!-- Laboratorio de Biología -->
  <a-entity 
    gltf-model="#laboratorio"  
    position="-14 0 0"  
    rotation="0 0 0"  
    scale="0.5 0.5 0.6">
  </a-entity>
  

  <!-- Cartel del departamento de Biología -->
  <a-image 
    src="#cartelbiologia" 
    position="-15.95 5.25 0"
    rotation="0 90 0" 
    width="3" 
    height="3"> 
  </a-image>

  <!-- Infografía de lentejas -->
  <a-image 
    src="#lentejas" 
    position="-15.95 4.5 -5"
    rotation="0 90 0" 
    width="3" 
    height="4"> 
  </a-image>

  <!-- Infografía de plantas -->
  <a-image 
    src="#plantas" 
    position="-15.95 4.5 5"
    rotation="0 90 0" 
    width="3" 
    height="4"> 
  </a-image>

  <!-- Póster de Biología -->
  <a-image 
    src="#biologia" 
    position="-4.75 3.5 -8"
    rotation="0 0 0" 
    width="4" 
    height="6"> 
  </a-image>

  <!-- Datos de semillas: varias copias inclinadas -->
  <a-image 
    src="#datos_semillas" 
    position="-14 2.25 0"
    rotation="-90 0 90" 
    width="1" 
    height="2"> 
  </a-image>

  <a-image 
    src="#datos_semillas" 
    position="-14 2.26 0"
    rotation="-90 15 90" 
    width="1" 
    height="2"> 
  </a-image>

  <a-image 
    src="#datos_semillas" 
    position="-14 2.27 0"
    rotation="-90 20 90" 
    width="1" 
    height="2"> 
  </a-image>

  <a-image 
    src="#datos_semillas" 
    position="-14 2.25 0"
    rotation="-90 30 90" 
    width="1" 
    height="2"> 
  </a-image>

  <!-- Vasos del experimento de semillas -->
  <a-entity 
    gltf-model="#variosvasos"  
    position="-14 2.25 -5"  
    rotation="0 0 0"  
    scale="0.15 0.15 0.15">
  </a-entity>
  <!-- lentejas-->
  <a-entity 
    gltf-model="#vasolentejas"  
    position="-14 2.25 6"  
    rotation="0 100 0"  
    scale="0.20 0.20 0.10">
  </a-entity>
  <a-entity 
    gltf-model="#vasolentejas"  
    position="-14 2.25 5"  
    rotation="0 100 0"  
    scale="0.20 0.20 0.10">
  </a-entity>
  <!-- planta 1-->
   <a-entity 
    gltf-model="#planta1"  
    position="-14.2 2.25 4"  
    rotation="0 100 0"  
    scale="0.08 0.15 0.05">
  </a-entity>
  <a-entity 
    gltf-model="#planta1"  
    position="-14.5 2.25 4"  
    rotation="0 100 0"  
    scale="0.08 0.15 0.05">
  </a-entity>
  <a-entity 
    gltf-model="#planta1"  
    position="-14.8 2.25 4"  
    rotation="0 100 0"  
    scale="0.08 0.15 0.05">
  </a-entity>
    <a-entity 
    gltf-model="#planta11"  
    position="-14.3 2.25 3"  
    rotation="0 100 0"  
    scale="0.08 0.15 0.05">
  </a-entity>
    <a-entity 
    gltf-model="#planta11"  
    position="-14.5 2.25 3"  
    rotation="0 100 0"  
    scale="0.08 0.15 0.05">
  </a-entity>
   <a-entity 
    gltf-model="#planta11"  
    position="-14.8 2.25 3"  
    rotation="0 100 0"  
    scale="0.08 0.15 0.05">
  </a-entity>
  <a-entity 
    gltf-model="#planta2"  
    position="-14.3 2.25 2"  
    rotation="0 100 0"  
    scale="0.15 0.2 0.1">
  </a-entity>
  <a-entity 
    gltf-model="#planta2"  
    position="-14.5 2.25 2"  
    rotation="0 100 0"  
    scale="0.15 0.2 0.1">
  </a-entity>
  <a-entity 
    gltf-model="#planta2"  
    position="-14.8 2.25 2"  
    rotation="0 100 0"  
    scale="0.15 0.2 0.1">
  </a-entity>
   <a-entity 
    gltf-model="#planta3"  
    position="-14.3 2.25 1"  
    rotation="0 100 0"  
    scale="0.15 0.2 0.1">
  </a-entity>
  <a-entity 
    gltf-model="#planta3"  
    position="-14.5 2.25 1"  
    rotation="0 100 0"  
    scale="0.15 0.2 0.1">
  </a-entity>
  <a-entity 
    gltf-model="#planta3"  
    position="-14.8 2.25 1"  
    rotation="0 100 0"  
    scale="0.15 0.2 0.1">
  </a-entity>
   <a-entity 
    gltf-model="#sinvaso"  
    position="-14.4 2.30 -1"  
    rotation="0 100 0"  
    scale="0.30 0.30 0.2">
  </a-entity>
  <a-entity 
    gltf-model="#sinvaso"  
    position="-14.8 2.3 -1"  
    rotation="0 100 0"  
    scale="0.30 0.30 0.2">
  </a-entity>
  <a-entity 
    gltf-model="#sinvaso"  
    position="-14.1 2.3 -1"  
    rotation="0 100 0"  
    scale="0.30 0.3 0.2">
  </a-entity>
   <a-entity 
    gltf-model="#regla"  
    position="-14.1 2.3 -2"  
    rotation="0 45 0"  
    scale="0.01 0.01 0.01">
  </a-entity>


  <!-- ========================================================= -->
  <!-- 5. ZONA EXTERIOR: GLOBO SONDA                            -->
  <!-- ========================================================= -->

  <!-- Globo sonda -->
  <a-entity 
    gltf-model="#globo" 
    position="0 1 30" 
    rotation="0 90 0" 
    scale="1 1 1">
  </a-entity>

  <!-- Caballete 1: lanzamiento -->
  <a-entity 
    gltf-model="#caballete" 
    position="10 0 30" 
    rotation="0 90 0" 
    scale="1 1.5 1">
  </a-entity>

  <a-image 
    src="#logos" 
    position="10.25 6 31.25"
    rotation="0 90 0" 
    width="1.25" 
    height="0.45"> 
  </a-image>

  <a-image 
    src="#lanzamiento" 
    position="10 3.5 30"
    rotation="0 -90 0" 
    width="4" 
    height="6"> 
  </a-image>

  <!-- Vídeo del inflado del globo -->
  <a-video
    src="#hinchar_globo"
    position="10 3 35"
    rotation="0 90 0"
    width="3"
    height="5">
  </a-video>

  <!-- Caballete 2 -->
  <a-entity 
    gltf-model="#caballete" 
    position="10 0 35" 
    rotation="0 90 0" 
    scale="1 1.5 1">
  </a-entity>

  <a-image 
    src="#logos" 
    position="10.25 6 36.25"
    rotation="0 90 0" 
    width="1.25" 
    height="0.45"> 
  </a-image>

  <!-- Caballete 3 -->
  <a-entity 
    gltf-model="#caballete" 
    position="-5 0 35" 
    rotation="0 90 0" 
    scale="1 1.5 1">
  </a-entity>

  <a-image 
    src="#logos" 
    position="-5 6 33.75"
    rotation="0 90 0" 
    width="1" 
    height="0.45"> 
  </a-image>

  <!-- Caballete 4 -->
  <a-entity 
    gltf-model="#caballete" 
    position="-5 0 30" 
    rotation="0 90 0" 
    scale="1 1.5 1">
  </a-entity>

  <a-image 
    src="#logos" 
    position="-5 6 29"
    rotation="0 90 0" 
    width="1.25" 
    height="0.45"> 
  </a-image>


  <!-- ========================================================= -->
  <!-- 6. CARTELES GENERALES DEL MUSEO                          -->
  <!-- ========================================================= -->

  <!-- Logos en la pared -->
  <a-image 
    src="#logos" 
    position="-9 5.25 8.15"
    rotation="0 0 0" 
    width="4" 
    height="1"> 
  </a-image>

  <!-- Vídeo del concurso -->
  <a-video
    src="#concurso"
    position="10 3 7.5"
    rotation="0 180 0"
    width="7"
    height="5">
  </a-video>

  <!-- Póster global -->
  <a-image 
    src="#poster_global" 
    position="8 3.5 8.15"
    rotation="0 0 0" 
    width="4" 
    height="6"> 
  </a-image>


  <!-- ========================================================= -->
  <!-- 7. CÁMARA DEL VISITANTE                                  -->
  <!-- ========================================================= -->

  <a-entity
    position="0 3.5 35"
    camera
    look-controls
    wasd-controls>
  </a-entity>

</a-scene>

</body>
</html>
