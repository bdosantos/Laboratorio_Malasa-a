<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Museo virtual - Globo sonda</title>

  <!-- Librería A-Frame -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
</head>

<body>
<a-scene>

  <!-- RECURSOS -->
  <a-assets>
    <!-- Modelos 3D -->
    <a-asset-item id="museo" src="museo.glb"></a-asset-item>
    <a-asset-item id="globo" src="globo.glb"></a-asset-item>
    <a-asset-item id="caballete" src="caballete.glb"></a-asset-item>

    <!-- Imágenes -->
    <img id="logos" src="logos.png">
    <img id="minerales" src="minerales.jpg">
    <img id="poster_global" src="poster_global.png">
    <img id="biologia" src="biologia.png">

    <!-- Vídeo -->
    <video 
      id="concurso" 
      src="concurso.mp4"
      autoplay
      loop
      muted
      playsinline
      webkit-playsinline
      preload="auto"
      crossorigin="anonymous">
    </video>
  </a-assets>

  <!-- CIELO AZUL -->
  <a-sky color="#87CEEB"></a-sky>

  <!-- LUZ GENERAL -->
  <a-light 
    type="ambient" 
    color="#FFFFFF" 
    intensity="0.7">
  </a-light>

  <a-light 
    type="directional" 
    position="4 8 4" 
    intensity="0.8">
  </a-light>

  <!-- PLANO VERDE EXTERIOR: CÉSPED -->
  <a-plane
    position="0 0 0"
    rotation="-90 0 0"
    width="100"
    height="100"
    color="#5FAF45">
  </a-plane>

  <!-- MODELO DEL MUSEO -->
  <a-entity 
    gltf-model="#museo"  
    position="0 0 0"  
    rotation="0 0 0"  
    scale="2 2 2">
  </a-entity>

  <!-- GLOBO SONDA FUERA DEL MUSEO -->
  <a-entity 
    gltf-model="#globo" 
    position="0 1 30" 
    rotation="0 90 0" 
    scale="1 1 1">
  </a-entity>

  <!-- CABALLETE FUERA DEL MUSEO -->
  <a-entity 
    gltf-model="#caballete" 
    position="10 1 30" 
    rotation="0 90 0" 
    scale="0.75 0.75 0.75">
  </a-entity>

  <!-- LOGOS EN LA PARED -->
  <a-image 
    src="#logos" 
    position="-9 5.25 16.25"
    rotation="0 0 0" 
    width="4" 
    height="1"> 
  </a-image>

  <!-- PÓSTER DE MINERALES / CRISTALES -->
  <a-image 
    src="#minerales" 
    position="5 3.5 -8"
    rotation="0 0 0" 
    width="4" 
    height="6"> 
  </a-image>

  <!-- VÍDEO DEL CONCURSO -->
  <a-video
    src="#concurso"
    position="10 3 -8"
    rotation="0 0 0"
    width="4"
    height="2.25">
  </a-video>

  <!-- PÓSTER DE BIOLOGÍA -->
  <a-image 
    src="#biologia" 
    position="0 3.5 -8"
    rotation="0 0 0" 
    width="4" 
    height="6"> 
  </a-image>

  <!-- PÓSTER GLOBAL -->
  <a-image 
    src="#poster_global" 
    position="8 3.5 16.25"
    rotation="0 0 0" 
    width="4" 
    height="6"> 
  </a-image>

  <!-- CÁMARA DEL VISITANTE -->
  <a-entity
    position="0 1.6 18"
    camera
    look-controls
    wasd-controls>
  </a-entity>

</a-scene>
</body>
</html>
