<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Museo virtual - Globo sonda</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
</head>

<body>
<a-scene>
        <a-assets>
            <a-asset-item id="museo" src="museo.glb"></a-asset-item>
            <a-asset-item id="Globo" src="Globo.glb"></a-asset-item>
           </a-assets>
  <!-- CIELO AZUL -->
  <a-sky color="#87CEEB"></a-sky>

  <!-- LUZ GENERAL -->
  <a-light type="ambient" color="#FFFFFF" intensity="0.7"></a-light>
  <a-light type="directional" position="4 8 4" intensity="0.8"></a-light>

  <!-- PLANO VERDE EXTERIOR -->
  <a-plane
    position="0 0 0"
    rotation="-90 0 0"
    width="80"
    height="80"
    color="#7BB661">
  </a-plane>

  <!-- MUSEO: SUELO INTERIOR TIPO PARQUET -->
  <a-plane
    position="0 0.03 -5"
    rotation="-90 0 0"
    width="24"
    height="16"
    color="#D8C3A5">
  </a-plane>

  <!-- TIRAS SUAVES PARA SIMULAR PARQUET -->
  <a-box position="-9 0.04 -5" width="2" height="0.02" depth="16" color="#E3D0B4"></a-box>
  <a-box position="-6 0.04 -5" width="2" height="0.02" depth="16" color="#CDB89F"></a-box>
  <a-box position="-3 0.04 -5" width="2" height="0.02" depth="16" color="#E3D0B4"></a-box>
  <a-box position="0 0.04 -5" width="2" height="0.02" depth="16" color="#D8C3A5"></a-box>
  <a-box position="3 0.04 -5" width="2" height="0.02" depth="16" color="#E3D0B4"></a-box>
  <a-box position="6 0.04 -5" width="2" height="0.02" depth="16" color="#CDB89F"></a-box>
  <a-box position="9 0.04 -5" width="2" height="0.02" depth="16" color="#E3D0B4"></a-box>

 


  <a-box
    position="8 2.5 3"
    width="8"
    height="5"
    depth="0.25"
    color="#F6FBFF">
  </a-box>

   <!-- Museo CTIF -->
        <a-entity 
            gltf-model="#museo"  
            position="0 0 0"  
            rotation="0 0 0"  
            scale="2 2 3">
        </a-entity>
 <a-entity 
            gltf-model="#Globo" 
            rotation="0 0 0" 
            position="-9 0 -8" 
            scale="0.7 0.7 0.6">
        </a-entity>

 
 









  <!-- CÁMARA -->
  <a-entity
    position="0 1.6 10"
    camera
    look-controls
    wasd-controls>
  </a-entity>

</a-scene>
</body>
</html>
